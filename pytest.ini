[pytest]
# 测试用例目录
testpaths = testcases
# 命令行默认参数：失败时短回溯、生成 allure 结果
addopts = -v
          --alluredir=report/tmp
          --clean-alluredir
          -ra
# 用例发现规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 自定义标记
markers =
    P0: 核心流程用例
    P1: 重要功能用例
    P2: 边缘与异常用例